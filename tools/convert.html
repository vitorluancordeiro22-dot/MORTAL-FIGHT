<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
const L = new FBXLoader();
const names=['walk','punch','hook','kick1','kick2','block','hit_reaction','knocked_down','dying','victory'];
let base; const clips=[]; const info={};
for (const n of names) {
  const o = await L.loadAsync('/assets-src/'+n+'.fbx');
  if(!base) base=o;
  const clip = o.animations.find(a=>a.tracks.length>0); clip.name=n;
  const hp = clip.tracks.find(t=>t.name.endsWith('Hips.position'));
  const v=hp.values; let mn=[1e9,1e9,1e9], mx=[-1e9,-1e9,-1e9];
  for(let i=0;i<v.length;i+=3) for(let k=0;k<3;k++){mn[k]=Math.min(mn[k],v[i+k]);mx[k]=Math.max(mx[k],v[i+k]);}
  info[n]={dur:clip.duration.toFixed(2), first:[v[0],v[1],v[2]].map(x=>x.toFixed(0)), last:[...v.slice(-3)].map(x=>x.toFixed(0)), min:mn.map(x=>x.toFixed(0)), max:mx.map(x=>x.toFixed(0))};
  // keep only rotation tracks + hips position (root motion removed later at runtime as needed)
  clip.tracks = clip.tracks.filter(t=>t.name.endsWith('.quaternion') || t.name.endsWith('Hips.position'));
  clips.push(clip);
}
base.animations = clips;
const ex = new GLTFExporter();
const buf = await ex.parseAsync(base, {binary:true, animations:clips});
window.INFO=JSON.stringify(info,null,0);
const b = new Uint8Array(buf); let s=''; for(let i=0;i<b.length;i+=0x8000) s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));
window.GLB=btoa(s); document.title='DONE';
</script>
